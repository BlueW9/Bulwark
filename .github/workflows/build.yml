name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK and write checksum
        run: |
          cp app/build/outputs/apk/release/app-release.apk Bulwark.apk
          sha256sum Bulwark.apk | tee Bulwark.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Bulwark
          path: |
            Bulwark.apk
            Bulwark.apk.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Bulwark.apk
            Bulwark.apk.sha256
